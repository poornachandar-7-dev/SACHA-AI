<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SACHA — AI Assistant</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="bg-glow"></div>
    
    <div class="app">
        <!-- Header -->
        <header class="app-header">
            <div class="brand">
                <div class="brand-mark">
                    <div class="pulse-core"></div>
                    <div class="pulse-ring"></div>
                </div>
                <div class="brand-text">
                    <div class="brand-name">SACHA</div>
                    <div class="brand-sub">AI Assistant</div>
                </div>
            </div>
            <div class="header-actions">
                <button id="gesture-toggle" class="voice-toggle">
                    <span id="gesture-icon">✋</span>
                    <span id="gesture-label">Gesture off</span>
                </button>
                <button id="voice-toggle" class="voice-toggle">
                    <span id="voice-icon">🔊</span>
                    <span id="voice-label">Voice on</span>
                </button>
            </div>
        </header>

        <!-- Gesture Panel -->
        <div id="gesture-panel" class="gesture-panel hidden">
            <video id="webcam" class="webcam-feed" autoplay playsinline muted></video>
            <canvas id="gesture-canvas" class="gesture-canvas"></canvas>
            <div class="gesture-hint">Move your hand in view of the camera</div>
        </div>

        <!-- Chat Area -->
        <main class="chat-log" id="chat-log">
            <div class="empty-state">
                <div class="empty-icon">✦</div>
                <h1 class="empty-title">Hey, I'm SACHA</h1>
                <p class="empty-hint">Speak or type · try "open youtube" · enable gesture mode above</p>
            </div>
        </main>

        <!-- Composer -->
        <footer class="composer">
            <button id="mic-btn" class="mic-btn" title="Voice input">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                    <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                    <line x1="12" y1="19" x2="12" y2="23"></line>
                    <line x1="8" y1="23" x2="16" y2="23"></line>
                </svg>
            </button>
            <input type="text" id="message-input" placeholder="Message SACHA..." autocomplete="off">
            <button id="send-btn" class="send-btn" title="Send message">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
            </button>
        </footer>
    </div>

    <!-- MediaPipe Dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    
    <!-- App Scripts -->
    <script src="Gesture.js"></script>
    <script src="script.js"></script>
</body>
</html>
