<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="cyber-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#7928CA" />
      <stop offset="100%" stop-color="#FF0080" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Hexagon -->
  <polygon points="50,6 88,28 88,72 50,94 12,72 12,28" 
           stroke="url(#cyber-grad)" 
           stroke-width="2.5" 
           fill="rgba(11, 15, 25, 0.7)" 
           filter="url(#glow)" />

  <!-- Inner Hexagon Frame -->
  <polygon points="50,16 79,33 79,67 50,84 21,67 21,33" 
           stroke="#00F0FF" 
           stroke-width="1.2" 
           stroke-opacity="0.6" 
           stroke-dasharray="4, 2" 
           fill="none" />

  <!-- Central Core Symbol: S Wave Matrix -->
  <path d="M 62,34 C 62,34 38,32 38,44 C 38,54 62,50 62,60 C 62,68 42,66 38,66" 
        stroke="url(#cyber-grad)" 
        stroke-width="4.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#glow)" />

  <!-- Neural Radiance Nodes -->
  <circle cx="50" cy="6" r="2.5" fill="#00F0FF" />
  <circle cx="88" cy="28" r="2.5" fill="#FF0080" />
  <circle cx="88" cy="72" r="2.5" fill="#00F0FF" />
  <circle cx="50" cy="94" r="2.5" fill="#7928CA" />
  <circle cx="12" cy="72" r="2.5" fill="#FF0080" />
  <circle cx="12" cy="28" r="2.5" fill="#00F0FF" />
</svg>

